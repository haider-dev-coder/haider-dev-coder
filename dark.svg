    <circle cx="1016" cy="43" r="4" fill="#48E0AD"><animate attributeName="opacity" values="1;.45;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="1027" y="47" font-family="Consolas, Menlo, monospace" font-size="11" fill="#48E0AD">OPEN TO BUILD</text>

