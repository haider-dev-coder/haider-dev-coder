      <text y="-57" opacity=".55">: + * # % @ @ % # * + :</text>
      <text y="-39" opacity=".7">+ * # % @ @ @ @ % # * +</text>
      <text y="-21" opacity=".82">* # % @  &lt; / &gt;  @ % # *</text>
      <text y="-3"># % @ @  CODE  @ @ % #</text>
      <text y="15" opacity=".85">* # % @  &lt; / &gt;  @ % # *</text>
      <text y="33" opacity=".7">+ * # % @ @ @ @ % # * +</text>
      <text y="51" opacity=".55">: + * # % @ @ % # * + :</text>
      <text y="69" opacity=".4">. : + * # % @ # * + : .</text>
      <animate attributeName="opacity" values=".82;1;.82" dur="5s" repeatCount="indefinite"/>
    </g>
    <path d="M83 327H391" stroke="#253B59" stroke-dasharray="3 6"/>
    <text x="237" y="348" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" letter-spacing="2" fill="#9AAAC2">BUILD · ITERATE · SHIP</text>
    <text x="66" y="402" font-family="Consolas, Menlo, monospace" font-size="11" fill="#7E96B7">$ whoami</text>
    <text x="66" y="431" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#F3F7FF">Haider Fareed</text>
    <text x="66" y="457" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#45D6F5">Full Stack Developer · AI/ML Engineer</text>
    <text x="66" y="489" font-family="Consolas, Menlo, monospace" font-size="12" fill="#9AAAC2">Turning ideas into useful software.</text>
    <text x="66" y="529" font-family="Consolas, Menlo, monospace" font-size="12" fill="#48E0AD">~/profile $ build --ship <tspan fill="#F3F7FF">_</tspan></text>
    <rect x="66" y="543" width="342" height="2" rx="1" fill="url(#accent)"/>

    <!-- right system panel -->
    <rect x="454" y="88" width="684" height="476" rx="18" fill="#0B1528" fill-opacity=".88" stroke="#253B59" filter="url(#shadow)"/>
