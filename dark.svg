    <text x="1090" y="163" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9AAAC2">status: evolving</text>

    <g font-family="Consolas, Menlo, monospace" font-size="12">
      <text x="488" y="213" fill="#7E96B7">&gt; ROLE</text><text x="620" y="213" fill="#F3F7FF">Full Stack Developer / AI-ML Engineer</text>
      <text x="488" y="243" fill="#7E96B7">&gt; FOCUS</text><text x="620" y="243" fill="#F3F7FF">Web platforms · AI agents · Mobile AI</text>
      <text x="488" y="273" fill="#7E96B7">&gt; FRONTEND</text><text x="620" y="273" fill="#F3F7FF">React · TypeScript · Tailwind CSS</text>
      <text x="488" y="303" fill="#7E96B7">&gt; BACKEND</text><text x="620" y="303" fill="#F3F7FF">Node.js · Express · FastAPI</text>
      <text x="488" y="333" fill="#7E96B7">&gt; AI / ML</text><text x="620" y="333" fill="#F3F7FF">LangChain · Gemini · YOLO</text>
      <text x="488" y="363" fill="#7E96B7">&gt; DATA</text><text x="620" y="363" fill="#F3F7FF">PostgreSQL · MySQL · MongoDB</text>
    </g>
    <path d="M482 386H1110" stroke="#253B59"/>
    <text x="488" y="410" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#A78BFA">SELECTED BUILDS</text>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="482" y="425" width="198" height="57" rx="9" fill="#101F36" stroke="#253B59"/>
      <text x="496" y="447" font-size="13" font-weight="700" fill="#F3F7FF">AI Sales Agent</text>
      <text x="496" y="466" font-size="10.5" fill="#9AAAC2">Website-grounded RAG + leads</text>
      <rect x="692" y="425" width="198" height="57" rx="9" fill="#101F36" stroke="#253B59"/>
      <text x="706" y="447" font-size="13" font-weight="700" fill="#F3F7FF">Guide Nest</text>
      <text x="706" y="466" font-size="10.5" fill="#9AAAC2">Accessible mobile AI assistant</text>
      <rect x="902" y="425" width="208" height="57" rx="9" fill="#101F36" stroke="#253B59"/>
      <text x="916" y="447" font-size="13" font-weight="700" fill="#F3F7FF">CRM System</text>
      <text x="916" y="466" font-size="10.5" fill="#9AAAC2">Leads, properties &amp; workflows</text>
    </g>
    <text x="488" y="517" font-family="Consolas, Menlo, monospace" font-size="11" fill="#7E96B7">CONNECT</text>
    <text x="570" y="517" font-family="Consolas, Menlo, monospace" font-size="12" fill="#45D6F5">github.com/haider-dev-coder</text>
    <text x="488" y="541" font-family="Consolas, Menlo, monospace" font-size="11" fill="#9AAAC2">Curious by default. Practical by design.</text>
    <rect x="18" y="18" width="1144" height="574" rx="24" fill="none" stroke="url(#accent)" stroke-width="1.2" stroke-opacity=".7"/>
