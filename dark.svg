    <text x="407" y="119" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="10" fill="#7E96B7">IDENTITY.NODE</text>
    <rect x="66" y="137" width="342" height="226" rx="12" fill="#101F36" stroke="#253B59"/>
    <g transform="translate(237 249)" font-family="Consolas, Menlo, monospace" text-anchor="middle" font-size="14" fill="url(#accent)">
