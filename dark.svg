<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Haider Fareed, Full Stack Developer and AI/ML Engineer. React, TypeScript, Node.js, FastAPI, LangChain, and mobile AI projects." preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/><stop offset="0.55" stop-color="#0A1426"/><stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"><animate attributeName="stop-color" values="#A78BFA;#45D6F5;#48E0AD;#A78BFA" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="0.55" stop-color="#45D6F5"><animate attributeName="stop-color" values="#45D6F5;#48E0AD;#A78BFA;#45D6F5" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#48E0AD"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#45D6F5" stop-opacity=".18"/><stop offset="1" stop-color="#45D6F5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#18304B" stroke-width=".7" opacity=".65"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#050914" flood-opacity=".25"/></filter>
    <clipPath id="frame"><rect x="18" y="18" width="1144" height="574" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
