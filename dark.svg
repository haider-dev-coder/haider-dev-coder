    <rect width="1180" height="610" fill="url(#grid)" opacity=".62"/>
    <circle cx="210" cy="210" r="300" fill="url(#glow)"><animate attributeName="cx" values="210;280;210" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="470" r="260" fill="url(#glow)" opacity=".7"/>
    <rect x="18" y="18" width="1144" height="574" rx="24" fill="none" stroke="#253B59" stroke-width="1.5"/>
    <rect x="19" y="19" width="1142" height="48" rx="23" fill="#0B1528" opacity=".96"/>
    <path d="M19 66H1161" stroke="#253B59"/>
